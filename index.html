<style>
:root{
  --text:#1a2e1a;

/* ===== LIVING SCENE ===== */
.scene{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,
    #5BA3D9 0%,
    #87CEEB 18%,
    #B8DFF0 32%,
    #E8F4C8 48%,
    #C8E6A0 62%,
    #8FBC6B 78%,
    #5A9B4A 100%);
}
.sun{
  position:absolute;top:7%;right:10%;
  width:min(18vw,100px);height:min(18vw,100px);border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fff8d0,#ffd54a 50%,#f0a020);
  box-shadow:0 0 40px 15px rgba(255,213,74,.5),0 0 100px 40px rgba(255,200,50,.25);
  animation:breathe 10s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* mountains */
.mtn{
  position:absolute;bottom:28%;left:0;right:0;height:35%;
  background:
    linear-gradient(160deg,transparent 45%,#6a8a9a 45.2%,#5a7a88 70%,#4a6a78 100%) left bottom/50% 100% no-repeat,
    linear-gradient(200deg,transparent 40%,#7a9a8a 40.2%,#5a8068 100%) right bottom/55% 90% no-repeat,
    linear-gradient(175deg,transparent 50%,#8aaa9a 50%,#6a8a7a 100%) center bottom/40% 70% no-repeat;
  opacity:.85;
}

/* forest silhouettes */
.trees{
  position:absolute;bottom:22%;left:0;right:0;height:28%;
  background:
    radial-gradient(ellipse 20px 50px at 8% 100%,#1e4d2b 0 70%,transparent 71%),
    radial-gradient(ellipse 28px 70px at 14% 100%,#245c32 0 70%,transparent 71%),
    radial-gradient(ellipse 18px 45px at 22% 100%,#1a4528 0 70%,transparent 71%),
    radial-gradient(ellipse 32px 80px at 78% 100%,#1e4d2b 0 70%,transparent 71%),
    radial-gradient(ellipse 24px 60px at 88% 100%,#245c32 0 70%,transparent 71%),
    radial-gradient(ellipse 16px 40px at 95% 100%,#1a4528 0 70%,transparent 71%);
}

/* grass field */
.field{
  position:absolute;bottom:0;left:0;right:0;height:24%;
  background:linear-gradient(180deg,#7cb86a 0%,#5a9b4a 40%,#4a8a3a 100%);
}
.blades{
  position:absolute;bottom:0;left:0;right:0;height:40px;
  background:repeating-linear-gradient(90deg,
    transparent 0 4px,#3d7a32 4px 6px,transparent 6px 11px,#2d6a28 11px 13px,transparent 13px 18px);
  opacity:.7;
  animation:sway 4s ease-in-out infinite;
  transform-origin:bottom;
}
@keyframes sway{0%,100%{transform:skewX(-2deg)}50%{transform:skewX(2deg)}}

/* water */
.water{
  position:absolute;bottom:18%;left:5%;right:25%;height:8%;
  border-radius:50% 40% 0 0;
  background:linear-gradient(180deg,rgba(100,180,220,.55),rgba(70,150,190,.4));
  box-shadow:inset 0 4px 12px rgba(255,255,255,.3);
  overflow:hidden;
}
.wave{
  position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,
    transparent 0 20px,rgba(255,255,255,.25) 20px 22px,transparent 22px 45px);
  animation:wave 6s linear infinite;
}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(45px)}}

/* birds */
.bird{
  position:absolute;width:12px;height:6px;
  border-radius:50%;
  background:transparent;
  box-shadow:-4px 0 0 #1a2e1a,4px 0 0 #1a2e1a;
  animation:fly 18s linear infinite;
  opacity:.7;
}
.bird::before,.bird::after{
  content:"";position:absolute;top:0;width:8px;height:3px;
  background:#1a2e1a;border-radius:50% 50% 0 0;
}
.bird::before{left:-8px;transform:rotate(-25deg);transform-origin:right}
.bird::after{right:-8px;transform:rotate(25deg);transform-origin:left;animation:flap 0.4s ease-in-out infinite alternate}
@keyframes flap{to{transform:rotate(-15deg)}}
@keyframes fly{
  0%{left:-5%;top:18%;transform:scale(.7)}
  100%{left:110%;top:12%;transform:scale(.7)}
}
.bird2{animation-delay:6s;top:22%;animation-duration:22s}
.bird3{animation-delay:12s;animation-duration:16s}

/* leaves */
.leaf{
  position:absolute;width:10px;height:10px;border-radius:0 70% 0 70%;
  background:#3d8b4f;opacity:.6;
  animation:fall linear infinite;
}
.leaf:nth-child(1){left:12%;animation-duration:13s}
.leaf:nth-child(2){left:30%;animation-duration:17s;animation-delay:2s;background:#6ab07a}
.leaf:nth-child(3){left:55%;animation-duration:15s;animation-delay:5s;background:#2d6a4f;width:8px;height:8px}
.leaf:nth-child(4){left:72%;animation-duration:19s;animation-delay:1s}
.leaf:nth-child(5){left:88%;animation-duration:14s;animation-delay:7s;background:#8bc98a}
@keyframes fall{
  0%{top:-5%;transform:rotate(0) translateX(0);opacity:0}
  8%{opacity:.6}
  100%{top:90%;transform:rotate(320deg) translateX(30px);opacity:0}
}

@media(prefers-reduced-motion:reduce){
  .sun,.blades,.wave,.bird,.bird::after,.leaf{animation:none!important}
  .leaf,.bird{display:none}
}

/* bottom sheet - short */

.row{

.pill{

.sticky .btn{width:100%;display:flex}
